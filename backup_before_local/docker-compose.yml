services:
  postgres:
    build:
      context: .
      dockerfile: docker/postgres/Dockerfile
    container_name: wavyai_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-wavyai}
      POSTGRES_USER: ${POSTGRES_USER:-wavyai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wavyai_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wavyai}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wavyai_network

  redis:
    image: redis:7-alpine
    container_name: wavyai_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wavyai_network

  qdrant:
    image: qdrant/qdrant:latest
    container_name: wavyai_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - wavyai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wavyai_backend
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wavyai}:${POSTGRES_PASSWORD:-wavyai_password}@postgres:5432/${POSTGRES_DB:-wavyai}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - wavyai_network

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wavyai_celery
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wavyai}:${POSTGRES_PASSWORD:-wavyai_password}@postgres:5432/${POSTGRES_DB:-wavyai}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - qdrant
    command: celery -A app.celery_app worker --loglevel=info
    networks:
      - wavyai_network

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wavyai_celery_beat
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-wavyai}:${POSTGRES_PASSWORD:-wavyai_password}@postgres:5432/${POSTGRES_DB:-wavyai}
      - REDIS_URL=redis://redis:6379/0
      - QDRANT_URL=http://qdrant:6333
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend:/app
      - ./data:/app/data
    depends_on:
      - postgres
      - redis
      - qdrant
    command: celery -A app.celery_app beat --loglevel=info
    networks:
      - wavyai_network

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

networks:
  wavyai_network:
    driver: bridge

